server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Disable client registration - this is the server
    register-with-eureka: false
    # Disable fetching registry - this is the server
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Désactiver l'auto-préservation en dev (évite l'avertissement "RENEWALS ARE LESSER THAN THRESHOLD")
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
