server:
  port: 8082

spring:
  application:
    name: quiz-badge-service
  datasource:
    url: jdbc:mysql://localhost:3306/quiz_badge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          format_sql: true
    open-in-view: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.elearning.quizbadge: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
