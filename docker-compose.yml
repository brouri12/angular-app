# ============================================================
#  Wordly Platform – Full Docker Compose Stack
#  Services: MySQL, Keycloak, Eureka, API Gateway,
#            10 microservices, 2 Angular frontends,
#            Jenkins, SonarQube, Prometheus, Grafana
# ============================================================

networks:
  wordly-net:
    driver: bridge

volumes:
  mysql-data:
  keycloak-data:
  jenkins-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-db-data:
  prometheus-data:
  grafana-data:

# ─────────────────────────────────────────────────────────────
#  INFRASTRUCTURE
# ─────────────────────────────────────────────────────────────
services:

  # ── MySQL (single instance, multiple databases) ──────────
  mysql:
    image: mysql:8.0
    container_name: wordly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./devops/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wordly-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: wordly-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wordly-net

  # ── Eureka Server ─────────────────────────────────────────
  eureka-server:
    build:
      context: ./EurekaServer
      dockerfile: Dockerfile
    container_name: wordly-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - wordly-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── API Gateway ───────────────────────────────────────────
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: wordly-gateway
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - wordly-net

# ─────────────────────────────────────────────────────────────
#  MICROSERVICES
# ─────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: wordly-user-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:9090/realms/wordly-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9090/realms/wordly-realm/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:9090
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:9090
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - wordly-net

