# ─────────────────────────────────────────────────────────────
#  FRONTENDS
# ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: wordly-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - wordly-net

  back-office:
    build:
      context: ./back-office
      dockerfile: Dockerfile
    container_name: wordly-backoffice
    restart: unless-stopped
    ports:
      - "4201:80"
    networks:
      - wordly-net

# ─────────────────────────────────────────────────────────────
#  CI/CD – JENKINS
# ─────────────────────────────────────────────────────────────

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: wordly-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    networks:
      - wordly-net

# ─────────────────────────────────────────────────────────────
#  CODE QUALITY – SONARQUBE
# ─────────────────────────────────────────────────────────────

  sonarqube-db:
    image: postgres:15-alpine
    container_name: wordly-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - wordly-net

  sonarqube:
    image: sonarqube:9.9-community
    container_name: wordly-sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - wordly-net

# ─────────────────────────────────────────────────────────────
#  MONITORING – PROMETHEUS + GRAFANA
# ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: wordly-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - wordly-net

  grafana:
    image: grafana/grafana:latest
    container_name: wordly-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - wordly-net
