      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    networks:
      - elearning-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8102/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  #-----------------------------------------------------------------------
  # API Gateway - Entry Point
  #-----------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    container_name: api-gateway
    ports:
      # Si 8080 est pris (ex. Oracle TNSLSNR), créer un fichier .env à la racine avec : API_GATEWAY_HOST_PORT=8085
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xms256m -Xmx512m
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - elearning-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

#-----------------------------------------------------------------------
# Networks
#-----------------------------------------------------------------------
networks:
  elearning-network:
    driver: bridge

#-----------------------------------------------------------------------
# Volumes (for persistent data)
#-----------------------------------------------------------------------
volumes:
  mysql-formation-data:
  mysql-quiz-data:
  mysql-review-todo-data:
  mysql-aggregate-data:
