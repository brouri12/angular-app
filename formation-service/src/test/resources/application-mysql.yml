spring:
  datasource:
    url: jdbc:mysql://localhost:3306/formation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

# Désactiver Eureka pour les tests
eureka:
  client:
    enabled: false

# Logging
logging:
  level:
    com.elearning.formation: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
