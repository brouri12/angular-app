<div class="salles-container p-6">
  <div class="header-section flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Rooms Management</h1>
      <p class="text-gray-600">Manage school rooms and capacities</p>
    </div>
  </div>

  <div *ngIf="showAddForm" class="bg-white p-6 rounded-lg shadow-md mb-6 border border-gray-200">
    <h2 class="text-xl font-semibold mb-4 text-gray-800">New Room details</h2>
    <form (ngSubmit)="saveSalle()" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Room Name</label>
        <input type="text" [(ngModel)]="newSalle.nomSalle" name="nomSalle" placeholder="e.g. A-101"
          class="w-full px-3 py-2 border border-gray-300 rounded text-gray-900 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <input type="text" [(ngModel)]="newSalle.localisation" name="loc" placeholder="e.g. Building A"
          class="w-full px-3 py-2 border border-gray-300 rounded text-gray-900 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Capacity</label>
        <input type="number" [(ngModel)]="newSalle.capacite" name="cap" min="1"
          class="w-full px-3 py-2 border border-gray-300 rounded text-gray-900 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded shadow transition-colors">
          Save Room
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="text-center py-12 text-gray-500">Loading rooms...</div>
  <div *ngIf="error" class="bg-red-50 text-red-600 p-4 rounded mb-6">{{ error }}</div>

  <div *ngIf="!loading && !error" class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Room
            Name</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Location</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Capacity</th>
          <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
            Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <ng-container *ngFor="let salle of salles">
          <!-- Normal row -->
          <tr *ngIf="editingSalle?.idSalle !== salle.idSalle" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ salle.idSalle }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ salle.nomSalle }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ salle.localisation }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                {{ salle.capacite }} seats
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
              <button (click)="startEdit(salle)" class="text-indigo-600 hover:text-indigo-900 font-medium">Edit</button>
              <button (click)="deleteSalle(salle.idSalle)"
                class="text-red-600 hover:text-red-900 font-medium">Delete</button>
            </td>
          </tr>

          <!-- Inline edit row -->
          <tr *ngIf="editingSalle?.idSalle === salle.idSalle" class="bg-indigo-50">
            <td class="px-6 py-3 text-sm text-gray-500">#{{ salle.idSalle }}</td>
            <td class="px-3 py-2">
              <input type="text" [(ngModel)]="editingSalle!.nomSalle" name="edit-nom-{{salle.idSalle}}"
                class="w-full px-2 py-1 border border-indigo-300 rounded text-gray-900 bg-white text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </td>
            <td class="px-3 py-2">
              <input type="text" [(ngModel)]="editingSalle!.localisation" name="edit-loc-{{salle.idSalle}}"
                class="w-full px-2 py-1 border border-indigo-300 rounded text-gray-900 bg-white text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </td>
            <td class="px-3 py-2">
              <input type="number" [(ngModel)]="editingSalle!.capacite" name="edit-cap-{{salle.idSalle}}" min="1"
                class="w-full px-2 py-1 border border-indigo-300 rounded text-gray-900 bg-white text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </td>
            <td class="px-6 py-3 whitespace-nowrap text-right text-sm font-medium space-x-3">
              <button (click)="saveEdit()" class="text-green-600 hover:text-green-900 font-medium">Save</button>
              <button (click)="cancelEdit()" class="text-gray-500 hover:text-gray-800 font-medium">Cancel</button>
            </td>
          </tr>
        </ng-container>

        <tr *ngIf="salles.length === 0">
          <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">No rooms found. Add one above!</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
