global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wordly-monitor'

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Eureka Server
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8888']

  # User Service
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8085']

  # Abonnement Service
  - job_name: 'abonnement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['abonnement-service:8084']

  # Challenge Service
  - job_name: 'challenge-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['challenge-service:8086']

  # Planification Service
  - job_name: 'planification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['planification-service:8087']

  # Event Service
  - job_name: 'event-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['event-service:8082']

  # Reservation Service
  - job_name: 'reservation-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['reservation-service:8083']

  # Recrutement Service
  - job_name: 'recrutement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['recrutement-service:8093']

  # Club Service
  - job_name: 'club-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['club-service:8089']

  # Member Service
  - job_name: 'member-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['member-service:8091']

  # Forum Service
  - job_name: 'forum-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['forum-service:8094']
