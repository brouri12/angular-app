# ============================================================
#  Ingress Configuration for Wordly Platform
# ============================================================
# Prerequisites:
#   - NGINX Ingress Controller must be installed
#   - DNS or /etc/hosts configured for domain names
#
# Install NGINX Ingress Controller:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/baremetal/deploy.yaml
#
# Add to /etc/hosts:
#   <node-ip> wordly.local api.wordly.local eureka.wordly.local keycloak.wordly.local admin.wordly.local
# ============================================================

---
# Main Ingress for Frontend and API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordly-ingress
  namespace: wordly
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    # Frontend Application
    - host: wordly.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 4200
    
    # Back-office Application
    - host: admin.wordly.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  number: 4201
    
    # API Gateway
    - host: api.wordly.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
    
    # Eureka Dashboard
    - host: eureka.wordly.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eureka-server
                port:
                  number: 8761
    
    # Keycloak
    - host: keycloak.wordly.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 9090

---
# Ingress for Individual Microservices (Optional - for direct access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordly-services-ingress
  namespace: wordly
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: services.wordly.local
      http:
        paths:
          - path: /user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8085
          
          - path: /abonnement(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: abonnement-service
                port:
                  number: 8084
          
          - path: /challenge(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: challenge-service
                port:
                  number: 8086
          
          - path: /planification(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: planification-service
                port:
                  number: 8087
          
          - path: /event(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-service
                port:
                  number: 8082
          
          - path: /reservation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: reservation-service
                port:
                  number: 8083
          
          - path: /recrutement(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: recrutement-service
                port:
                  number: 8093
          
          - path: /club(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: club-service
                port:
                  number: 8089
          
          - path: /member(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: member-service
                port:
                  number: 8091
          
          - path: /forum(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: forum-service
                port:
                  number: 8094
          
          - path: /formation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: formation-service
                port:
                  number: 8081
          
          - path: /quiz(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quiz-badge-service
                port:
                  number: 8092
          
          - path: /pronunciation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pronunciation-service
                port:
                  number: 8095
          
          - path: /feedback(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: feedback-service
                port:
                  number: 8096
