apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: wordly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: your-dockerhub-username/api-gateway:latest
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: wordly
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888
