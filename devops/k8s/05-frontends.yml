apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wordly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-username/wordly-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wordly
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30420
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-office
  namespace: wordly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-office
  template:
    metadata:
      labels:
        app: back-office
    spec:
      containers:
        - name: back-office
          image: your-dockerhub-username/wordly-backoffice:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: back-office
  namespace: wordly
spec:
  type: NodePort
  selector:
    app: back-office
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30421
