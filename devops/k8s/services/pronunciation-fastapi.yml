# ============================================================
#  Pronunciation FastAPI - Kubernetes Deployment & Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pronunciation-fastapi
  namespace: wordly
  labels:
    app: pronunciation-fastapi
    tier: backend
    category: ai
    language: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pronunciation-fastapi
  template:
    metadata:
      labels:
        app: pronunciation-fastapi
        tier: backend
        category: ai
        language: python
    spec:
      containers:
        - name: pronunciation-fastapi
          image: marwenazouzi1/pronunciation-fastapi:latest
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pronunciation-fastapi
  namespace: wordly
  labels:
    app: pronunciation-fastapi
spec:
  type: ClusterIP
  selector:
    app: pronunciation-fastapi
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
