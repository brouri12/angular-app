# ============================================================
#  Quiz Badge Service - Kubernetes Deployment & Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-badge-service
  namespace: wordly
  labels:
    app: quiz-badge-service
    tier: backend
    category: elearning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-badge-service
  template:
    metadata:
      labels:
        app: quiz-badge-service
        tier: backend
        category: elearning
    spec:
      containers:
        - name: quiz-badge-service
          image: marwenazouzi1/quiz-badge-service:latest
          ports:
            - containerPort: 8092
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-quiz:3306/quiz_badge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-badge-service
  namespace: wordly
  labels:
    app: quiz-badge-service
spec:
  type: ClusterIP
  selector:
    app: quiz-badge-service
  ports:
    - port: 8092
      targetPort: 8092
      protocol: TCP
      name: http
