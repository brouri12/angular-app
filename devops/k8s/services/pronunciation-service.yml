# ============================================================
#  Pronunciation Service - Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pronunciation-service
  namespace: wordly
  labels:
    app: pronunciation-service
    tier: backend
    component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pronunciation-service
  template:
    metadata:
      labels:
        app: pronunciation-service
        tier: backend
        component: microservice
    spec:
      containers:
        - name: pronunciation-service
          image: YOUR_ACTUAL_USERNAME/pronunciation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
              name: http
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-pronunciation:3306/pronunciation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: FASTAPI_URL
              value: http://pronunciation-fastapi:8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8095
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8095
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pronunciation-service
  namespace: wordly
  labels:
    app: pronunciation-service
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: pronunciation-service
  ports:
    - port: 8095
      targetPort: 8095
      protocol: TCP
      name: http
