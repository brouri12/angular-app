# ============================================================
#  Formation Service - Kubernetes Deployment & Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formation-service
  namespace: wordly
  labels:
    app: formation-service
    tier: backend
    category: elearning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: formation-service
  template:
    metadata:
      labels:
        app: formation-service
        tier: backend
        category: elearning
    spec:
      containers:
        - name: formation-service
          image: marwenazouzi1/formation-service:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-formation:3306/formation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: formation-service
  namespace: wordly
  labels:
    app: formation-service
spec:
  type: ClusterIP
  selector:
    app: formation-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
