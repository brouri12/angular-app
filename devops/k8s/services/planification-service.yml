# ============================================================
#  Planification Service - Kubernetes Deployment & Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planification-service
  namespace: wordly
  labels:
    app: planification-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planification-service
  template:
    metadata:
      labels:
        app: planification-service
        tier: backend
    spec:
      containers:
        - name: planification-service
          image: YOUR_ACTUAL_USERNAME/planification-service:latest
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/planification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: planification-service
  namespace: wordly
  labels:
    app: planification-service
spec:
  type: ClusterIP
  selector:
    app: planification-service
  ports:
    - port: 8087
      targetPort: 8087
      protocol: TCP
      name: http
