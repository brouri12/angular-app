spring.application.name=FORUM-SERVICE
server.port=8094

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/forum_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Spring Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# File Storage
forum.storage.upload-directory=uploads
forum.storage.max-image-size=10485760
forum.storage.max-audio-size=26214400
forum.storage.max-document-size=52428800
forum.storage.allowed-image-formats=jpg,jpeg,png,gif,webp
forum.storage.allowed-audio-formats=mp3,wav,ogg
forum.storage.allowed-document-formats=pdf,zip,rar,doc,docx,xls,xlsx

