# Application Configuration
spring.application.name=forum-service
server.port=8082

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/forum_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&autoReconnect=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Transaction Configuration - Force commit
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Désactiver H2 Console
spring.h2.console.enabled=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Logging
logging.level.tn.esprit.forum=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================================
# ADVANCED FORUM FEATURES CONFIGURATION
# ============================================================================

# File Storage Configuration
# Directory where uploaded files will be stored (relative to application root)
forum.storage.upload-directory=uploads
# Maximum file sizes in bytes
forum.storage.max-image-size=10485760
forum.storage.max-audio-size=26214400
forum.storage.max-document-size=52428800
# Allowed file extensions
forum.storage.allowed-image-formats=jpg,jpeg,png,gif,webp
forum.storage.allowed-audio-formats=mp3,wav,ogg
forum.storage.allowed-document-formats=pdf,zip,rar,doc,docx,xls,xlsx

