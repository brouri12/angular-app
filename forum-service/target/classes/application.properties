forum.email.from-name=FORUM JUNGLE IN ENGLISH
# Email retry configuration
forum.email.max-retry-attempts=3
forum.email.retry-delay-ms=1000

# OpenAI API Configuration
# IMPORTANT: Replace with your actual OpenAI API key
forum.openai.api-key=YOUR_OPENAI_API_KEY_HERE
forum.openai.gpt-model=gpt-4
forum.openai.whisper-model=whisper-1
forum.openai.max-tokens=500
forum.openai.temperature=0.7
forum.openai.timeout-seconds=30

# Async Executor Configuration for Background Tasks
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=forum-async-

# Scheduled Tasks Configuration
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=forum-scheduler-

# Chatbot Configuration
forum.chatbot.rate-limit-per-minute=5
forum.chatbot.conversation-context-limit=3
forum.chatbot.response-timeout-seconds=3
