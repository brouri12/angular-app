# SonarQube Configuration for Pronunciation FastAPI
sonar.projectKey=pronunciation-fastapi
sonar.projectName=Pronunciation FastAPI Service
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.language=py
sonar.python.version=3.10

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,**/venv/**,**/env/**

# Test coverage (if you add tests later)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.python.xunit.reportPath=test-results.xml
