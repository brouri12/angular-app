global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: formation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["formation-service:8081"]

  - job_name: quiz-badge-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["quiz-badge-service:8082"]
