name: API Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
      - ".github/workflows/_backend-service-ci.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
      - ".github/workflows/_backend-service-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_backend-service-ci.yml
    with:
      service_path: api-gateway
      service_name: api-gateway
    secrets: inherit
