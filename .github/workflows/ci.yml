name: CI

on:
  push:
    branches:
      - main
      - master
      - feature/**
      - devops
      - complete-devops-setup
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: Validate monitoring compose syntax
        run: docker compose -f devops/monitoring/docker-compose.yml config > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/angular-app/package-lock.json
            back-office/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/angular-app

      - name: Build frontend
        run: npm run build --if-present
        working-directory: frontend/angular-app

      - name: Install back-office dependencies
        run: npm ci
        working-directory: back-office

      - name: Build back-office
        run: npm run build --if-present
        working-directory: back-office
