server.port=8082
spring.application.name=quiz-badge-service

# Eureka : si vous voyez "Connection refused" sur localhost:8761, soit demarrez eureka-server,
# soit lancez avec le profil "local" (voir application-local.properties et DEMARRER_QUIZ_BADGE_8082.cmd a la racine pi06).

# Texte du certificat PDF badge (GET /api/badges/{id}/certificate)
elearning.certificate.brand-title=Jungle in English
elearning.certificate.subtitle=Certificate of Quiz Achievement
elearning.certificate.footer=Authorized & verified by Jungle in English

# Chatbot (POST /api/chatbot/student et /api/auth/chatbot/student sur ce service)
# Définir au moins une clé (OpenAI ou Hugging Face) pour que le coach réponde.
# chatbot.openai.api-key=
# chatbot.openai.model=gpt-4o-mini
# chatbot.huggingface.api-key=
# chatbot.huggingface.model=Qwen/Qwen2.5-7B-Instruct

# Thymeleaf (désactiver le cache en dev pour voir les changements de templates sans redémarrer)
spring.thymeleaf.cache=false

# MySQL Database (integrated with Wordly platform)
spring.datasource.url=jdbc:mysql://localhost:3307/quiz_badge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka (activer pour enregistrement sur le serveur Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logging
logging.level.com.elearning=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Management
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# OpenFeign (quiz-badge → formation-service pour enrichissement quiz / badges)
spring.cloud.openfeign.client.config.formation-service.connect-timeout=3000
spring.cloud.openfeign.client.config.formation-service.read-timeout=5000
logging.level.com.elearning.quizbadge.client=DEBUG
