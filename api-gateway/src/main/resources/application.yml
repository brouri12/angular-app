server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      
      # Route definitions
      routes:
        # API Node (données E-Learning: students, courses, enrollments, teachers, questions, badges, pédagogie, materials)
        - id: node-api
          uri: http://localhost:8083
          predicates:
            - Path=/api/students,/api/courses,/api/enrollments,/api/teachers,/api/questions,/api/badges,/api/database/**,/api/pedagogy/**,/api/levels/**,/api/chapters/**,/api/lessons/**,/api/quizzes/**,/api/quiz-questions/**,/api/quiz-attempts/**,/api/materials/**,/api/responses/**,/api/ping
        # Formation Service
        - id: formation-service
          uri: lb://FORMATION-SERVICE
          predicates:
            - Path=/api/formation/**
          filters:
            - StripPrefix=1
        
        # Quiz Badge Service - Quiz endpoints
        - id: quiz-badge-service-quiz
          uri: lb://QUIZ-BADGE-SERVICE
          predicates:
            - Path=/api/quiz/**
          filters:
            - StripPrefix=1
        
        # Quiz Badge Service - Badge endpoints
        - id: quiz-badge-service-badge
          uri: lb://QUIZ-BADGE-SERVICE
          predicates:
            - Path=/api/badge/**
          filters:
            - StripPrefix=1

        # Review Todo Service
        - id: review-todo-service
          uri: lb://REVIEW-TODO-SERVICE
          predicates:
            - Path=/api/review-todos/**

        # --- Microservices Esprit (decouverte Eureka) ---
        - id: membre-service
          uri: lb://MEMBRE-SERVICE
          predicates:
            - Path=/membres/**
        - id: club-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/clubs/**
        - id: reservation-service
          uri: lb://REGISTRATION-SERVICE
          predicates:
            - Path=/registrations/**
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/events/**
        - id: forum-service
          uri: lb://FORUM-SERVICE
          predicates:
            - Path=/api/forum/**
        - id: recrutement-service
          uri: lb://RECRUTEMENT-SERVICE
          predicates:
            - Path=/api/recrutement/**
        - id: user-service-users
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: user-service-auth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: user-service-payments
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: user-service-subscriptions
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/subscriptions/**
        - id: planification-groups
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/api/groups/**
        - id: planification-calendar
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/api/calendar/**
        - id: planification-planifications
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/api/planifications/**
        - id: planification-analytics-rooms
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/api/analytics/rooms/**
        - id: planification-salles
          uri: lb://PLANIFICATION-SERVICE
          predicates:
            - Path=/api/salles/**
        - id: challenge-challenges
          uri: lb://CHALLENGE-SERVICE
          predicates:
            - Path=/api/challenges/**
        - id: challenge-submissions
          uri: lb://CHALLENGE-SERVICE
          predicates:
            - Path=/api/submissions/**
        - id: challenge-stats
          uri: lb://CHALLENGE-SERVICE
          predicates:
            - Path=/api/stats/**
        - id: challenge-test-scheduler
          uri: lb://CHALLENGE-SERVICE
          predicates:
            - Path=/api/test/scheduler/**
        - id: abonnement-abonnements
          uri: lb://ABONNEMENT-SERVICE
          predicates:
            - Path=/api/abonnements/**
        - id: abonnement-promo
          uri: lb://ABONNEMENT-SERVICE
          predicates:
            - Path=/api/promo/**
        - id: abonnement-renewal
          uri: lb://ABONNEMENT-SERVICE
          predicates:
            - Path=/api/renewal/**
        - id: abonnement-subscription-reminders
          uri: lb://ABONNEMENT-SERVICE
          predicates:
            - Path=/api/subscription-reminders/**
        - id: abonnement-test-email
          uri: lb://ABONNEMENT-SERVICE
          predicates:
            - Path=/api/test/**

# Eureka Discovery Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    port: ${server.port}
    version: 1.0.0

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.elearning.gateway: DEBUG
